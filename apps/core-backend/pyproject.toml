[project]
name = "core-backend"
version = "0.1.0"
description = "MetroIsJustABus core backend: accounts, roles, network, schedules, trips, disruptions."
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=23.1",
  "django>=5.2,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "gunicorn>=22",
  "metro-common",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.8",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.sources]
metro-common = { path = "../../packages/metro_common", editable = true }
