[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
pythonpath = . ../../packages/metro_common
testpaths = common/tests subscriptions/tests preferences/tests notifications/tests
markers =
    unit: Unit tests (no database, no network)
    integration: Integration tests (real PostgreSQL, RabbitMQ)
    contract: Interface contract tests
    system: End-to-end and system scenarios
    failure: Failure injection and recovery tests
    req: Requirement ID traceability marker (NFR-087)
