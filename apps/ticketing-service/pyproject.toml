[project]
name = "ticketing-service"
version = "0.1.0"
description = "MetroIsJustABus ticketing service: ticket types, purchases, tickets."
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "structlog>=24.1",
  "gunicorn>=22",
  "metro-common",
]

[tool.uv]
package = false

[tool.uv.sources]
metro-common = { path = "../../packages/metro_common", editable = true }
