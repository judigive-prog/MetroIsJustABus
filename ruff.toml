# Ruff runs from the repo root in CI, so tell it where each service's own modules live.
# metro_common is deliberately NOT listed: it is an installed dependency, and the
# existing code already groups it with third-party imports.
src = ["apps/notification-service", "apps/ticketing-service", "simulators/payment-sim"]

# The existing code uses lines up to ~120 characters.
line-length = 120
target-version = "py313"

[lint]
# E/F = pycodestyle and pyflakes basics, I = import sorting.
# RUF012 is intentionally not enabled: Django's Meta.constraints/indexes and
# DRF's permission_classes are idiomatic.
select = ["E4", "E7", "E9", "F", "I"]
