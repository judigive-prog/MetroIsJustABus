name: CI

# =============================================================================
# PIPELINE OVERVIEW (read this first)
#
#   WHEN:   on every pull request to main, and on every push (merge) to main.
#   FLOW:   (1) checks, in parallel ........ lint, contracts, secret-scan, test-*
#           (2) build-images ............... only if ALL checks pass; builds the
#                                            3 Docker images, tags them with the
#                                            git commit SHA, pushes them to GHCR
#                                            (push only happens on main)
#           (3) deploy-dev ................. only on main; runs on our dev VM and
#                                            deploys the SHA-tagged images
#
#   WHERE (what is done where):
#     Code style / lint ............ job `lint`
#     API + event contract checks .. job `contracts`
#     Secret scan (safety) ......... job `secret-scan`
#     Automated tests .............. jobs `test-metro-common`, `test-payment-sim`,
#                                    `test-ticketing`, `test-notification`
#     Docker build / versioned image job `build-images`   (Dockerfiles live next
#                                    to each service; tag = commit SHA)
#     Deployment to development .... job `deploy-dev`     (stack file:
#                                    deploy/stack/dev.yml)
#     Integration / system tests ... commented-out job at the bottom (not active)
#
#   NOT YET DONE (be honest in the demo): coverage threshold, dependency/image
#   vulnerability scan, automatic post-deploy smoke test, production deployment.
# =============================================================================

# SECURITY: this workflow deliberately uses `pull_request` (NOT `pull_request_target`
# or `workflow_run`). PRs from forks therefore run with a read-only token and no
# secrets, so untrusted PR code can never run in a privileged context (pwn request).
# Do not add secrets, package/deploy permissions or self-hosted runners to PR jobs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for every job. A job that needs more must declare it itself.
permissions:
  contents: read

# If a new commit is pushed to the same PR, cancel the older run (saves time).
# Runs on main are never cancelled, so every merge is fully built and deployed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # QUALITY CHECK 1 - code style and common bugs (ruff). Config: /ruff.toml.
  # Fails the pipeline if any file is badly formatted or has a lint error.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  # ---------------------------------------------------------------------------
  # QUALITY CHECK 2 - interface contracts (NFR-006). The OpenAPI / AsyncAPI /
  # JSON-schema files in /contracts must match the code ("drift" check) and the
  # example messages must validate. A breaking API change fails here.
  # ---------------------------------------------------------------------------
  contracts:
    name: Versioned interface contracts (NFR-006)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prepare isolated contract environments
        run: |
          uv sync --locked --project packages/metro_common --group contracts
          uv sync --locked --project apps/ticketing-service --group contracts
          uv sync --locked --project simulators/payment-sim
      - name: Check generated contracts for drift
        run: |
          uv run --locked --project packages/metro_common python contracts/generate_events.py --check
          uv run --locked --project packages/metro_common python contracts/generate_events.py --asyncapi --check
          uv run --locked --project apps/ticketing-service python contracts/generate_openapi.py --check
          uv run --locked --project simulators/payment-sim python contracts/generate_openapi.py --service payment-sim --check
      - name: Validate examples and component boundaries
        run: |
          uv run --locked --project packages/metro_common --group contracts python contracts/validate_events.py
          uv run --locked --project apps/ticketing-service --group contracts python contracts/check_payment_contract.py
          uv run --locked --project apps/ticketing-service --group contracts python contracts/check_event_contract.py
          uv run --locked --project packages/metro_common --group contracts python contracts/validate_asyncapi.py
        # AsyncAPI validation downloads a pinned official meta-schema over HTTPS.
        # These checks need no broker, database, credentials or self-hosted runner.

  # ---------------------------------------------------------------------------
  # SAFETY CHECK - gitleaks scans the whole git history (fetch-depth: 0) for
  # accidentally committed passwords, tokens and keys.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read-only token under `permissions` above

  # ---------------------------------------------------------------------------
  # AUTOMATED TESTS - one job per component, so a failure points at the culprit.
  # Test files live in each component's `tests/` folders.
  # NOTE: metro_common currently has 0 tests (see the exit-code-5 tolerance below).
  # ---------------------------------------------------------------------------
  test-metro-common:
    name: Tests (metro_common)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run pytest
        working-directory: packages/metro_common
        run: uv run --with pytest pytest -m "not integration and not system" || [ $? -eq 5 ]
        # `|| [ $? -eq 5 ]` tolerates "no tests collected" while the repo has no tests yet.
        # Remove it once tests exist.

  # payment-sim: the payment simulator (SQLite). Secrets are throw-away files
  # created on the runner, never real credentials.
  test-payment-sim:
    name: Tests (payment-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create throw-away test secrets
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          echo "ci-only-not-a-secret-key" > "$RUNNER_TEMP/secrets/secret_key"
          echo "ci-only-service-token" > "$RUNNER_TEMP/secrets/service_token"
      - name: Run pytest
        working-directory: simulators/payment-sim
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY_FILE: ${{ runner.temp }}/secrets/secret_key
          SERVICE_TOKEN_FILE: ${{ runner.temp }}/secrets/service_token
          SIM_DB_PATH: ${{ runner.temp }}/payment_sim.sqlite3
          ALLOWED_HOSTS: '["localhost","testserver"]'
        # The simulator's first application migration is pending. Build its test schema from the models.
        run: uv run --locked --with pytest --with pytest-django pytest --no-migrations -m "not system"

  # ticketing-service: tests run against a REAL PostgreSQL 17 container (the
  # `services:` block below), not a mock, so database behaviour is tested too.
  test-ticketing:
    name: Tests (ticketing-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create throw-away test secrets
        run: |
          d="$RUNNER_TEMP/secrets"
          mkdir -p "$d"
          echo "ci-only-not-a-secret-key" > "$d/secret_key"
          echo "ci-only-password" > "$d/db_password"
          echo "ci-only-service-token" > "$d/payment_sim_token"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$d/jwt_private.pem"
          openssl pkey -in "$d/jwt_private.pem" -pubout -out "$d/jwt_public.pem"
      - name: Run pytest
        working-directory: apps/ticketing-service
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY_FILE: ${{ runner.temp }}/secrets/secret_key
          ALLOWED_HOSTS: '["localhost","testserver"]'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/secrets/db_password
          JWT_PUBLIC_KEY_FILE: ${{ runner.temp }}/secrets/jwt_public.pem
          PAYMENT_SIM_URL: http://localhost:8001
          PAYMENT_SIM_TOKEN_FILE: ${{ runner.temp }}/secrets/payment_sim_token
        # The ticketing apps have no application migrations yet. The tests still use PostgreSQL.
        run: uv run --locked --group contracts --with pytest --with pytest-django pytest --no-migrations -m "not system"

  # notification-service: uses its own test settings (config/test_settings.py).
  test-notification:
    name: Tests (notification-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run pytest
        working-directory: apps/notification-service
        run: uv run --group dev pytest -m "not integration and not system"

  # ---------------------------------------------------------------------------
  # CONTAINERISATION + VERSIONED ARTEFACT.
  # `needs:` = this job waits for every check above; if any is red, no image.
  # The `matrix` runs this job once per service (3 builds in parallel).
  # On a PR the image is only BUILT (proves the Dockerfile works).
  # On a push to main it is also PUSHED to GHCR as
  #   ghcr.io/<owner>/<repo>/<service>:<git commit SHA>
  # The SHA tag is the version: it links commit -> image -> deployed stack.
  # ---------------------------------------------------------------------------
  build-images:
    name: Build image (${{ matrix.name }})
    needs: [lint, contracts, secret-scan, test-metro-common, test-payment-sim, test-ticketing, test-notification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # only used on push to main; PRs from forks get a read-only token anyway
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: notification-service, dockerfile: apps/notification-service/Dockerfile }
          - { name: ticketing-service, dockerfile: apps/ticketing-service/Dockerfile }
          - { name: payment-sim, dockerfile: simulators/payment-sim/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ env.REPO }}/${{ matrix.name }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # AUTOMATIC DEPLOYMENT TO DEVELOPMENT.
  # Runs ONLY after a merge to main (never on PRs, see `if:`), and only after
  # the images were pushed (`needs: build-images`).
  # `runs-on: [self-hosted, dev]` = the runner installed on our dev VM
  # (Ubuntu 24.04). `docker stack deploy` updates the Docker Swarm stack defined
  # in deploy/stack/dev.yml to the images tagged with this commit's SHA.
  # Docker secrets (passwords, keys) already live on the VM; none are in git.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images]
    runs-on: [self-hosted, dev]
    environment: dev # protected environment: add required reviewers in repo settings
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy stack
        env:
          TAG: ${{ github.sha }}
        run: |
          export REPO="${GITHUB_REPOSITORY,,}"
          docker stack deploy --with-registry-auth -c deploy/stack/dev.yml metro

  # ---------------------------------------------------------------------------
  # Integration / system tests on the self-hosted runner (dev VM), NFR-095.
  # NEVER run this on pull requests: a PR could execute arbitrary code on the VM.
  # It runs only after a merge to main, i.e. after a code-owner-approved review.
  # Uncomment when integration tests exist.
  #
  # integration-dev:
  #   name: Integration and system tests (dev VM)
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   needs: [lint, secret-scan, test-metro-common, test-payment-sim, test-ticketing]
  #   runs-on: [self-hosted, dev]
  #   environment: dev        # protected environment: add required reviewers in repo settings
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - run: echo "run integration/system tests here"
  # ---------------------------------------------------------------------------
