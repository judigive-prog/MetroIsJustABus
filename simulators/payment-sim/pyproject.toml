[project]
name = "payment-sim"
version = "0.1.0"
description = "Simulated, idempotent payment provider for MetroIsJustABus tests and demos. Never processes real payments."
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.30,<0.31",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "gunicorn>=22",
]

[tool.uv]
package = false
